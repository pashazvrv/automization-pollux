<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Разметка эталона</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f6f5f1;--fg:#1d1d1b;--card:#fff;--mut:#6b6b66;--bd:#dcdad2;
--task:#ffd966;--tc:#f4b183;--fc:#9dc3e6;--bgd:#c5e0b3;--role:#d5a6e6;--mat:#d0d0d0}
@media (prefers-color-scheme:dark){:root{--bg:#1b1b1a;--fg:#ececea;--card:#262625;--mut:#a0a09a;--bd:#3a3a38;
--task:#8a6d00;--tc:#8a4a1c;--fc:#1f4e79;--bgd:#3b6b24;--role:#6b2f86;--mat:#555}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:5}
main{display:grid;grid-template-columns:1fr 340px;gap:16px;padding:16px;max-width:1400px;margin:auto}
@media(max-width:900px){main{grid-template-columns:1fr}}
#text{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px;white-space:pre-wrap;word-wrap:break-word;font-size:15px;user-select:text}
.hl{border-radius:3px;cursor:pointer;padding:1px 0}
.hl[data-c=task]{background:var(--task)}.hl[data-c=tc]{background:var(--tc)}.hl[data-c=fc]{background:var(--fc)}
.hl[data-c=bg]{background:var(--bgd)}.hl[data-c=role]{background:var(--role)}.hl[data-c=mat]{background:var(--mat)}
aside{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;align-self:start;position:sticky;top:60px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--fg)}
.cb{display:flex;width:100%;justify-content:space-between;margin-bottom:6px;text-align:left}
.cb[data-c=task]{border-left:10px solid var(--task)}.cb[data-c=tc]{border-left:10px solid var(--tc)}.cb[data-c=fc]{border-left:10px solid var(--fc)}
.cb[data-c=bg]{border-left:10px solid var(--bgd)}.cb[data-c=role]{border-left:10px solid var(--role)}.cb[data-c=mat]{border-left:10px solid var(--mat)}
kbd{background:var(--bg);border:1px solid var(--bd);border-radius:4px;padding:0 6px;font-size:13px}
.mut{color:var(--mut);font-size:13px}textarea{width:100%;font:inherit;background:var(--bg);color:var(--fg);border:1px solid var(--bd);border-radius:6px}
#list div{font-size:13px;padding:3px 0;border-top:1px solid var(--bd);display:flex;gap:6px}
#list i{flex:none;width:34px;font-style:normal;font-weight:600}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 14px;border-radius:6px;display:none}
</style></head><body>
<header>
<button id="prev">←</button><b id="pos"></b><button id="next">→</button>
<span class="mut" id="id"></span><span class="mut" id="done"></span>
<span style="flex:1"></span>
<button id="export">Скачать разметку (JSON)</button>
</header>
<main>
<div id="text"></div>
<aside>
<div class="mut" style="margin-bottom:8px">Выдели текст мышью и нажми цифру (или кнопку). Клик по цветному фрагменту — удалить.</div>
<button class="cb" data-c="task"><span>Задача</span><kbd>1</kbd></button>
<button class="cb" data-c="tc"><span>Ограничение задачи</span><kbd>2</kbd></button>
<button class="cb" data-c="fc"><span>Ограничение формата</span><kbd>3</kbd></button>
<button class="cb" data-c="bg"><span>Контекст: фон</span><kbd>4</kbd></button>
<button class="cb" data-c="role"><span>Контекст: роль</span><kbd>5</kbd></button>
<button class="cb" data-c="mat"><span>Контекст: материал (текст/данные/код)</span><kbd>6</kbd></button>
<label style="display:block;margin:10px 0"><input type="checkbox" id="indiv"> Неделимый запрос <kbd>0</kbd></label>
<div class="mut">Если нельзя разделить на классы, не размечай, а поставь галочку и напиши причину в заметке.</div>
<textarea id="note" rows="3" placeholder="Заметка (необязательно)"></textarea>
__RULES__
<div class="mut" style="margin:10px 0 4px">Размечено в этом запросе:</div><div id="list"></div>
<div class="mut" style="margin-top:10px"><kbd>←</kbd><kbd>→</kbd> между запросами (вне поля заметки). Прогресс сохраняется в браузере автоматически.</div>
</aside></main><div id="toast"></div>
<script>
const ITEMS=__ITEMS__;
const INIT=__INIT__;
const NAMES={task:"Задача",tc:"Огр. задачи",fc:"Огр. формата",bg:"Фон",role:"Роль",mat:"Материал"};
const KEYS={"1":"task","2":"tc","3":"fc","4":"bg","5":"role","6":"mat"};
const SK="__SK__";
let S={};try{S=JSON.parse(localStorage.getItem(SK)||"{}")}catch(e){}
let cur=0;
const $=id=>document.getElementById(id);
function st(){const id=ITEMS[cur].id;if(!S[id]){const i=INIT[id];S[id]=i?JSON.parse(JSON.stringify(i)):{ann:[],indivisible:false,note:"",seen:false}}return S[id]}
function save(){try{localStorage.setItem(SK,JSON.stringify(S))}catch(e){}}
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",1800)}
function render(){
 const it=ITEMS[cur],s=st(),txt=it.text;s.seen=true;
 $("pos").textContent=(cur+1)+" / "+ITEMS.length;$("id").textContent=it.id;
 const n=Object.values(S).filter(x=>x.ann.length||x.indivisible).length;$("done").textContent="размечено: "+n;
 const ann=[...s.ann].sort((a,b)=>a.start-b.start);
 const box=$("text");box.innerHTML="";let p=0;
 const add=(a,b,c,idx)=>{if(b<=a)return;const e=document.createElement("span");e.textContent=txt.slice(a,b);e.dataset.s=a;
  if(c){e.className="hl";e.dataset.c=c;e.dataset.i=idx;e.title=NAMES[c]+" (клик — удалить)"}box.appendChild(e)};
 ann.forEach(x=>{add(p,x.start,null);add(x.start,x.end,x.cls,s.ann.indexOf(x));p=x.end});add(p,txt.length,null);
 $("indiv").checked=s.indivisible;$("note").value=s.note;
 const L=$("list");L.innerHTML="";
 ann.forEach(x=>{const d=document.createElement("div");d.innerHTML="<i>"+NAMES[x.cls].slice(0,6)+"</i><span></span>";
  d.lastChild.textContent=x.text.length>70?x.text.slice(0,70)+"…":x.text;L.appendChild(d)});
 save();
}
function selRange(){
 const sel=getSelection();if(!sel.rangeCount||sel.isCollapsed)return null;
 const r=sel.getRangeAt(0);if(!$("text").contains(r.startContainer)||!$("text").contains(r.endContainer))return null;
 const off=(node,o)=>{let sp=node.nodeType===3?node.parentElement:node;
  if(sp===$("text")){return o===0?0:ITEMS[cur].text.length}
  return +sp.dataset.s+o};
 let a=off(r.startContainer,r.startOffset),b=off(r.endContainer,r.endOffset);if(a>b)[a,b]=[b,a];
 const t=ITEMS[cur].text;while(a<b&&/\s/.test(t[a]))a++;while(b>a&&/\s/.test(t[b-1]))b--;
 return b>a?[a,b]:null}
function mark(c){
 const r=selRange();if(!r){toast("Сначала выдели текст");return}
 const s=st(),[a,b]=r;
 if(s.ann.some(x=>a<x.end&&x.start<b)){toast("Пересекается с уже размеченным — сначала удали его кликом");return}
 s.ann.push({cls:c,start:a,end:b,text:ITEMS[cur].text.slice(a,b)});getSelection().removeAllRanges();render()}
$("text").addEventListener("click",e=>{const el=e.target.closest(".hl");if(el&&getSelection().isCollapsed){st().ann.splice(+el.dataset.i,1);render()}});
document.querySelectorAll(".cb").forEach(b=>b.onclick=()=>mark(b.dataset.c));
$("indiv").onchange=e=>{st().indivisible=e.target.checked;render()};
$("note").oninput=e=>{st().note=e.target.value;save()};
const go=d=>{cur=Math.max(0,Math.min(ITEMS.length-1,cur+d));render();scrollTo(0,0)};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
document.addEventListener("keydown",e=>{
 if(e.target.tagName==="TEXTAREA")return;
 if(KEYS[e.key]){mark(KEYS[e.key]);e.preventDefault()}
 else if(e.key==="0"){const c=$("indiv");c.checked=!c.checked;c.onchange({target:c})}
 else if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1)});
$("export").onclick=()=>{
 const out=ITEMS.map(it=>{const s=S[it.id]||{ann:[],indivisible:false,note:""};
  return {id:it.id,text:it.text,annotations:[...s.ann].sort((a,b)=>a.start-b.start),indivisible:s.indivisible,note:s.note,annotated:!!(s.ann.length||s.indivisible)}});
 const u=URL.createObjectURL(new Blob([JSON.stringify(out,null,1)],{type:"application/json"}));
 const a=document.createElement("a");a.href=u;a.download="__FILE__";a.click()};
render();
</script></body></html>
